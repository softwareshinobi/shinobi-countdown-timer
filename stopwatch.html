<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch / Software Shinobi</title>
    <!-- Bootswatch 'Quartz' Theme -->
    <link rel="stylesheet" href="https://bootswatch.com/5/quartz/bootstrap.min.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Styles for Fullscreen Layout and Intention Display -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 56px; /* Adjust for fixed-top navbar height */
        }
        .intention-display {
            font-size: 8vw; /* Responsive font size */
            font-weight: bold;
            color: #ffc107; /* Warning color from Bootswatch */
            margin-bottom: 20px;
            max-width: 90%; /* Limit width to prevent overflow */
            word-wrap: break-word; /* Break long words */
            line-height: 1.2;
            cursor: pointer; /* Indicate it's clickable */
        }
        @media (min-width: 768px) {
            .intention-display {
                font-size: 60px; /* Fixed size for desktop */
            }
        }
        .timer-display {
            /* Responsive font size based on viewport width */
            font-size: 30vw;
            font-weight: bold;
            line-height: 1;
        }
        /* Media query for larger screens to cap font size */
        @media (min-width: 768px) {
            .timer-display {
                font-size: 200px; /* A fixed large size for desktop */
            }
        }
        .controls-container .btn {
            margin: 10px; /* Increased margin for larger buttons */
            padding: 15px 30px; /* Bigger padding */
            font-size: 1.5rem; /* Larger font size for buttons */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-primary fixed-top" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index.html">Shinobi Clocks</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/countdown.html">Countdown</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/stopwatch.html">Stopwatch</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#intentionModal">
                            <i class="fas fa-cog"></i> <!-- Gear Icon -->
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Intention Display -->
    <div class="intention-display" id="intention-display">
        <!-- Intention will be displayed here -->
    </div>

    <!-- Stopwatch Display -->
    <div class="timer-display" id="stopwatch-display">
        00:00
    </div>

    <!-- Main Start/Pause/Reset Controls -->
    <div class="controls-container">
        <div class="btn-group btn-group-lg" role="group" aria-label="Stopwatch controls">
             <button type="button" class="btn btn-success" id="start-btn">Start</button>
             <button type="button" class="btn btn-warning" id="pause-btn">Pause</button>
             <button type="button" class="btn btn-danger" id="reset-btn">Reset</button>
        </div>
    </div>

    <!-- Intention Modal -->
    <div class="modal fade" id="intentionModal" tabindex="-1" aria-labelledby="intentionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="intentionModalLabel">Set Your Intention</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="intentionInput" class="form-label">What are you working on?</label>
                        <textarea class="form-control" id="intentionInput" rows="3" placeholder="e.g., 'Analyzing data for the Q3 report'"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveIntentionBtn">Save Intention</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS for any components that might need it -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Stopwatch JavaScript Logic -->
    <script>
        const stopwatchDisplay = document.getElementById('stopwatch-display');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const intentionDisplay = document.getElementById('intention-display');
        const intentionInput = document.getElementById('intentionInput');
        const saveIntentionBtn = document.getElementById('saveIntentionBtn');

        let interval; // To hold the setInterval instance
        let elapsedTime = 0; // Time elapsed in milliseconds
        let startTime = 0; // When the timer was last started/resumed
        let isRunning = false; // Flag to indicate if stopwatch is running

        const INTENTION_STORAGE_KEY = 'stopwatchIntention';
        const STOPWATCH_STATE_STORAGE_KEY = 'stopwatchState'; // Key for stopwatch state

        /**
         * Saves the current stopwatch state to local storage.
         */
        function saveStopwatchState() {
            const state = {
                elapsedTime: elapsedTime,
                isRunning: isRunning,
                startTime: isRunning ? Date.now() : 0 // Save current time if running to calculate elapsed time on load
            };
            localStorage.setItem(STOPWATCH_STATE_STORAGE_KEY, JSON.stringify(state));
        }

        /**
         * Loads the stopwatch state from local storage.
         * @returns {boolean} True if state was loaded, false otherwise.
         */
        function loadStopwatchState() {
            const savedState = localStorage.getItem(STOPWATCH_STATE_STORAGE_KEY);
            if (savedState) {
                const state = JSON.parse(savedState);
                elapsedTime = state.elapsedTime;
                isRunning = state.isRunning;

                if (isRunning && state.startTime) {
                    // Calculate additional elapsed time since last save
                    elapsedTime += Date.now() - state.startTime;
                    runStopwatch(); // Restart the stopwatch
                }
                displayTime(elapsedTime); // Update display immediately
                return true;
            }
            return false;
        }

        /**
         * Updates the stopwatch display with the formatted time.
         * @param {number} ms - The total milliseconds to display.
         */
        function displayTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10); // Display centiseconds

            const display = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}.${milliseconds < 10 ? '0' : ''}${milliseconds}`;

            stopwatchDisplay.textContent = display;
            document.title = display; // Update page title
        }

        /**
         * Core stopwatch function that increments time.
         */
        function runStopwatch() {
            if (isRunning) return; // Prevent multiple intervals

            isRunning = true;
            startTime = Date.now(); // Record when the stopwatch started/resumed

            interval = setInterval(() => {
                elapsedTime += Date.now() - startTime; // Add time passed since last update
                startTime = Date.now(); // Reset startTime for next interval
                displayTime(elapsedTime);
                saveStopwatchState(); // Save state regularly
            }, 10); // Update every 10 milliseconds for centisecond precision
        }

        /**
         * Pauses the stopwatch.
         */
        function pauseStopwatch() {
            clearInterval(interval);
            isRunning = false;
            saveStopwatchState(); // Save state when paused
        }

        /**
         * Resets the stopwatch to 00:00.
         */
        function resetStopwatch() {
            clearInterval(interval);
            isRunning = false;
            elapsedTime = 0;
            startTime = 0;
            displayTime(0);
            localStorage.removeItem(STOPWATCH_STATE_STORAGE_KEY); // Clear saved state on reset
        }

        /**
         * Loads the saved intention from local storage and displays it.
         */
        function loadIntention() {
            const savedIntention = localStorage.getItem(INTENTION_STORAGE_KEY);
            if (savedIntention) {
                intentionDisplay.textContent = savedIntention;
                intentionInput.value = savedIntention; // Also set it in the modal input
            } else {
                intentionDisplay.textContent = "What's your focus?"; // Default text if nothing saved
                intentionInput.value = "";
            }
        }

        /**
         * Saves the current intention to local storage and updates the display.
         */
        function saveIntention() {
            const currentIntention = intentionInput.value.trim();
            localStorage.setItem(INTENTION_STORAGE_KEY, currentIntention);
            intentionDisplay.textContent = currentIntention || "What's your focus?"; // Display placeholder if empty
            // Hide the modal
            const modalElement = document.getElementById('intentionModal');
            const modal = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
            modal.hide();
        }

        // --- Event Listeners ---
        startBtn.addEventListener('click', runStopwatch);
        pauseBtn.addEventListener('click', pauseStopwatch);
        resetBtn.addEventListener('click', resetStopwatch);

        // Intention display click to open modal
        intentionDisplay.addEventListener('click', () => {
            const modalElement = document.getElementById('intentionModal');
            const modal = new bootstrap.Modal(modalElement);
            modal.show();
        });

        saveIntentionBtn.addEventListener('click', saveIntention);

        // Event listener to load intention into modal when it's about to be shown
        const intentionModal = document.getElementById('intentionModal');
        intentionModal.addEventListener('show.bs.modal', function () {
            intentionInput.value = localStorage.getItem(INTENTION_STORAGE_KEY) || "";
        });

        // Initialize display on load
        loadIntention(); // Load intention on page load
        loadStopwatchState(); // Load stopwatch state on page load

        // Make controls visible on load (they were display:none, now just ensure they are visible)
        document.querySelector('.controls-container').style.display = 'block';
    </script>
</body>
</html>
